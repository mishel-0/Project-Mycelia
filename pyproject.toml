[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelia"
version = "1.2.1"
description = "Experimental dimensional fungal physiology core with a preserved mycelial graph prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.8"]
images = ["Pillow>=10"]
learning = ["Pillow>=10", "scikit-learn>=1.4", "joblib>=1.3"]
medical = ["nibabel>=5.2", "scikit-learn>=1.4"]

[project.scripts]
mycelia = "mycelia.cli:main"

[tool.setuptools.packages.find]
include = ["mycelia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
